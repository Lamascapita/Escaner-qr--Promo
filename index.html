<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Escáner QR Profesional + Carga de Imagen PNG</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            text-align: center;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            max-width: 520px;
            width: 100%;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        h2 {
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
        }

        .sub {
            color: #5b6e8c;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: inline-block;
            padding-bottom: 6px;
        }

        #reader {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .status-panel {
            background: #f8fafc;
            border-radius: 28px;
            padding: 12px 16px;
            margin-top: 20px;
            margin-bottom: 18px;
        }

        #msg {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading-bar {
            width: 100%;
            height: 5px;
            background: #e2e8f0;
            margin-top: 14px;
            border-radius: 20px;
            overflow: hidden;
            display: none;
        }

        .loading-bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            transition: width 0.25s ease-out;
            border-radius: 20px;
        }

        .upload-zone {
            margin-top: 22px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 20px;
        }

        .file-label {
            background: #f1f5f9;
            border: 1.5px dashed #94a3b8;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
        }

            .file-label:hover {
                background: #e6edf5;
                border-color: #3b82f6;
                color: #0f2b6d;
                transform: scale(0.98);
            }

        input[type="file"] {
            display: none;
        }

        .info-badge {
            font-size: 0.7rem;
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 40px;
            color: #2563eb;
            margin-top: 12px;
            display: inline-block;
        }

        @media (max-width: 480px) {
            .card {
                padding: 18px 16px 24px;
            }

            #reader {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card">
            <h2>📷 Lector QR</h2>
            <div class="sub">Cámara en vivo o imagen PNG</div>

            <div id="reader"></div>

            <div class="status-panel">
                <div id="msg">
                    <span class="icon">🔍</span> Apunta la cámara al código QR
                </div>
                <div class="loading-bar" id="bar">
                    <div class="loading-bar-inner" id="progress"></div>
                </div>
            </div>

            <div class="upload-zone">
                <label for="qrFile" class="file-label">
                    📂 Subir imagen (PNG / JPG) con código QR
                </label>
                <input type="file" id="qrFile" accept="image/png, image/jpeg, image/jpg">
                <div class="info-badge">
                    ⚡ Redirección automática al detectar QR
                </div>
            </div>
        </div>
    </div>

    <script>
    // ---------- Variables globales ----------
    let cameraScannerInstance = null;
    let isProcessing = false;
    let currentFileScanner = null;

    const msgElement = document.getElementById('msg');
    const loadingBar = document.getElementById('bar');
    const progressBarInner = document.getElementById('progress');
    const fileInput = document.getElementById('qrFile');

    // ---------- Funciones auxiliares ----------
    function setMessage(text, isError = false, isSuccess = false) {
        msgElement.innerHTML = `<span class="icon">${isError ? '⚠️' : (isSuccess ? '✅' : '🔍')}</span> ${text}`;
        msgElement.style.color = isError ? '#b91c1c' : (isSuccess ? '#15803d' : '#1e293b');
    }

    function showProgressBar(percent = 0) {
        loadingBar.style.display = 'block';
        progressBarInner.style.width = Math.min(100, Math.max(0, percent)) + '%';
    }

    function hideProgressBar() {
        loadingBar.style.display = 'none';
        progressBarInner.style.width = '0%';
    }

    function redirectToUrl(url, delayMs = 700) {
        if (isProcessing) return;
        isProcessing = true;

        setMessage("✅ ¡QR detectado! Redirigiendo ahora...", false, true);
        showProgressBar(100);

        setTimeout(() => {
            window.location.href = url;
        }, delayMs);
    }

    // ---------- Control de cámara ----------
    async function stopCameraScanner() {
        if (cameraScannerInstance) {
            try {
                await cameraScannerInstance.clear();
                console.log("Escáner de cámara detenido");
            } catch (err) {
                console.warn("Error al limpiar escáner:", err);
            }
            cameraScannerInstance = null;
        }
    }

    async function startCameraScanner() {
        if (cameraScannerInstance || isProcessing) return;

        try {
            cameraScannerInstance = new Html5QrcodeScanner(
                "reader",
                {
                    fps: 18,
                    qrbox: { width: 260, height: 260 },
                    aspectRatio: 1.0,
                    disableFlip: false,
                    rememberLastUsedCamera: true,
                },
                false
            );

            cameraScannerInstance.render(onQrDetectedByCamera, onCameraScanError);
            setMessage("📷 Cámara activa. Enfoca un código QR", false);
        } catch (err) {
            console.error("Error al iniciar cámara:", err);
            setMessage("❌ No se pudo acceder a la cámara. Verifica permisos.", true);
            cameraScannerInstance = null;
        }
    }

    function onQrDetectedByCamera(decodedText) {
        if (isProcessing || !decodedText || decodedText.trim() === "") return;

        console.log("QR detectado por cámara:", decodedText);

        if (cameraScannerInstance) {
            cameraScannerInstance.clear().catch(e => console.warn);
            cameraScannerInstance = null;
        }

        setMessage(`🎯 QR leído: ${decodedText.length > 40 ? decodedText.substring(0, 40) + '…' : decodedText}`, false, false);
        showProgressBar(70);
        redirectToUrl(decodedText, 750);
    }

    function onCameraScanError(err) {
        // Ignorar errores de "no QR found"
        if (err && typeof err === 'string' && err.includes("No QR code found")) return;
        console.log("Escaneo sin QR:", err);
    }

    // ---------- Escanear desde imagen ----------
    async function decodeQrFromImageFile(file) {
        const tempScannerId = "temp-hidden-qr-scanner";
        let tempContainer = document.getElementById(tempScannerId);
        if (!tempContainer) {
            tempContainer = document.createElement('div');
            tempContainer.id = tempScannerId;
            tempContainer.style.position = "fixed";
            tempContainer.style.top = "-1000px";
            tempContainer.style.left = "-1000px";
            tempContainer.style.width = "1px";
            tempContainer.style.height = "1px";
            tempContainer.style.opacity = "0";
            tempContainer.style.pointerEvents = "none";
            document.body.appendChild(tempContainer);
        }

        const imageScanner = new Html5Qrcode(tempScannerId);
        currentFileScanner = imageScanner;

        try {
            const decodedText = await imageScanner.scanFile(file, false);
            return decodedText;
        } catch (err) {
            console.error("Error al decodificar archivo:", err);
            throw new Error("No se pudo leer ningún código QR en la imagen");
        } finally {
            if (currentFileScanner) {
                await currentFileScanner.clear().catch(e => console.warn);
                currentFileScanner = null;
            }
        }
    }

    async function handleUploadedFile(file) {
        if (!file || isProcessing) return;

        if (!file.type.includes('image')) {
            setMessage("❌ El archivo no es una imagen válida (usa PNG o JPG)", true);
            setTimeout(() => {
                if (!isProcessing) setMessage("📷 Cámara activa. Enfoca un código QR", false);
            }, 2000);
            return;
        }

        await stopCameraScanner();

        setMessage(`📂 Procesando imagen: ${file.name.substring(0, 28)}...`, false);
        showProgressBar(30);
        setTimeout(() => showProgressBar(55), 100);

        try {
            const qrUrl = await decodeQrFromImageFile(file);
            if (!qrUrl || qrUrl.trim() === "") throw new Error("QR vacío");

            showProgressBar(100);
            setMessage(`✅ QR leído correctamente. Redirigiendo...`, false, true);

            setTimeout(() => {
                window.location.href = qrUrl;
            }, 700);
        } catch (error) {
            console.error(error);
            setMessage(`⚠️ No se encontró QR legible en la imagen. Intenta otra foto.`, true);
            hideProgressBar();
            setTimeout(() => {
                if (!isProcessing) {
                    setMessage("📷 Cámara nuevamente activa. Escanea o sube otro archivo.", false);
                    startCameraScanner();
                }
            }, 2200);
        } finally {
            fileInput.value = '';
            if (!isProcessing) {
                setTimeout(() => hideProgressBar(), 1000);
            }
        }
    }

    // ---------- Eventos ----------
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file && !isProcessing) {
            handleUploadedFile(file);
        } else if (isProcessing) {
            setMessage("⏳ Redirigiendo, por favor espera...", false);
            fileInput.value = '';
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        startCameraScanner();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !cameraScannerInstance && !isProcessing) {
            console.log("Pestaña activa nuevamente, reiniciando cámara");
            startCameraScanner();
        }
    });

    // ✅ Corregido: sintaxis correcta, llaves y paréntesis cerrados
    window.addEventListener('beforeunload', () => {
        if (cameraScannerInstance) {
            cameraScannerInstance.clear().catch(e => console.warn);
        }
        if (currentFileScanner) {
            currentFileScanner.clear().catch(e => console.warn);
        }
    });
    </script>
</body>
</html>
