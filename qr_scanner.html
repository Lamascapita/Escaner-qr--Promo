<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de QR Automático</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #e7f3ff;
            display: none;
            word-break: break-all;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        /* Estilos personalizados para los botones de la librería */
        #reader button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 10px 0;
            transition: background 0.3s;
        }

        #reader button:hover {
            background-color: #357abd;
        }

        #reader select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Escáner QR</h1>
    <p>Apunta con tu cámara al código QR para ser redirigido automáticamente.</p>
    
    <div id="reader"></div>
    
    <div id="result">
        <strong>Detectado:</strong> <span id="qr-text"></span>
    </div>
    
    <div class="status" id="status-message">
        Esperando permiso de cámara...
    </div>
</div>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        // Detener el escaneo para evitar múltiples redirecciones
        html5QrcodeScanner.clear();
        
        // Mostrar el resultado visualmente
        document.getElementById('result').style.display = 'block';
        document.getElementById('qr-text').innerText = decodedText;
        document.getElementById('status-message').innerText = "Redirigiendo...";

        // Validar si es una URL y redirigir
        try {
            const url = new URL(decodedText);
            // Pequeño retraso para que el usuario vea que se detectó
            setTimeout(() => {
                window.location.href = url.href;
            }, 1500);
        } catch (e) {
            // Si no es una URL válida, solo mostrar el texto
            document.getElementById('status-message').innerText = "Contenido detectado (no es una URL válida).";
            document.getElementById('status-message').style.color = "orange";
        }
    }

    function onScanFailure(error) {
        // Errores de escaneo comunes (como no encontrar QR en el frame actual)
        // No solemos mostrar nada aquí para no saturar la consola
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 10, 
            qrbox: {width: 250, height: 250},
            rememberLastUsedCamera: true,
            aspectRatio: 1.0
        },
        /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
